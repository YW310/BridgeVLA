        &lt;h3&gt;当前 · regression_state&lt;/h3&gt;
        &lt;svg class=&quot;state-wiring&quot; viewBox=&quot;0 0 320 510&quot; role=&quot;img&quot; aria-labelledby=&quot;new-state-title new-state-description&quot;&gt;
          &lt;title id=&quot;new-state-title&quot;&gt;当前状态直接进入 queries 和每层 AdaLN&lt;/title&gt;
          &lt;desc id=&quot;new-state-description&quot;&gt;Gemma 视觉 tokens 和归一化后的状态 token 保留在 memory。状态另投影为 s，与门控 key 和时间组成条件 c，直接加到动作 queries 并调制每层 AdaLN。最后确定性回归世界 EEF 轨迹。&lt;/desc&gt;
          &lt;defs&gt;&lt;marker id=&quot;new-state-arrow&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;5&quot; markerHeight=&quot;5&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0 0L10 5L0 10Z&quot; fill=&quot;currentColor&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;

            &lt;path d=&quot;M75 70V160&quot;/&gt;
            &lt;path d=&quot;M245 215V245&quot;/&gt;
            &lt;path d=&quot;M75 235V355&quot;/&gt;

          &lt;g class=&quot;comparison-wires comparison-state-wire&quot; marker-end=&quot;url(#new-state-arrow)&quot;&gt;
            &lt;path d=&quot;M180 120H160V190H140&quot;/&gt;

          &lt;/g&gt;
          &lt;g class=&quot;comparison-node comparison-vision&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;10&quot; width=&quot;300&quot; height=&quot;60&quot; rx=&quot;5&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;34&quot;&gt;Gemma 的 coarse/refine 图像 tokens&lt;/text&gt;&lt;text x=&quot;160&quot; y=&quot;55&quot;&gt;Fᶜ、Fᶠ → 视觉投影&lt;/text&gt;&lt;/g&gt;
          &lt;g class=&quot;comparison-node comparison-state&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;95&quot; width=&quot;130&quot; height=&quot;50&quot; rx=&quot;5&quot;/&gt;&lt;text x=&quot;245&quot; y=&quot;116&quot;&gt;q6 / 开度归一化&lt;/text&gt;&lt;text x=&quot;245&quot; y=&quot;135&quot;&gt;投影 s：[B,256]&lt;/text&gt;&lt;/g&gt;
          &lt;g class=&quot;comparison-node&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;165&quot; width=&quot;130&quot; height=&quot;50&quot; rx=&quot;5&quot;/&gt;&lt;text x=&quot;245&quot; y=&quot;186&quot;&gt;预测 key × gate&lt;/text&gt;&lt;text x=&quot;245&quot; y=&quot;205&quot;&gt;gate 初值 0.1&lt;/text&gt;&lt;/g&gt;
          &lt;g class=&quot;comparison-node&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;160&quot; width=&quot;130&quot; height=&quot;75&quot; rx=&quot;5&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;182&quot;&gt;视觉 Memory&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;203&quot;&gt;视觉 + 状态 token&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;224&quot;&gt;[B,1537,256]&lt;/text&gt;&lt;/g&gt;
          &lt;text class=&quot;comparison-edge-label&quot; x=&quot;75&quot; y=&quot;294&quot;&gt;Cross-Attention&lt;/text&gt;
          &lt;g class=&quot;comparison-node comparison-state&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;245&quot; width=&quot;130&quot; height=&quot;65&quot; rx=&quot;5&quot;/&gt;&lt;text x=&quot;245&quot; y=&quot;265&quot;&gt;条件 c&lt;/text&gt;&lt;text x=&quot;245&quot; y=&quot;284&quot;&gt;s + gate × key&lt;/text&gt;&lt;text x=&quot;245&quot; y=&quot;303&quot;&gt;+ E_time(τ=1)&lt;/text&gt;&lt;/g&gt;
          &lt;g class=&quot;comparison-node comparison-state&quot;&gt;&lt;rect x=&quot;180&quot; y=&quot;330&quot; width=&quot;130&quot; height=&quot;50&quot; rx=&quot;5&quot;/&gt;&lt;text x=&quot;245&quot; y=&quot;351&quot;&gt;动作 queries + c&lt;/text&gt;&lt;text x=&quot;245&quot; y=&quot;370&quot;&gt;[B,16,256]&lt;/text&gt;&lt;/g&gt;
          &lt;g class=&quot;comparison-node comparison-state&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;355&quot; width=&quot;130&quot; height=&quot;75&quot; rx=&quot;5&quot;/&gt;&lt;text x=&quot;75&quot; y=&quot;378&quot;&gt;动作 blocks&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;399&quot;&gt;Self / Cross Attn&lt;/text&gt;&lt;text x=&quot;75&quot; y=&quot;420&quot;&gt;每层 AdaLN(c)&lt;/text&gt;&lt;/g&gt;
          &lt;g class=&quot;comparison-node&quot;&gt;&lt;rect x=&quot;10&quot; y=&quot;460&quot; width=&quot;300&quot; height=&quot;40&quot; rx=&quot;5&quot;/&gt;&lt;text x=&quot;160&quot; y=&quot;485&quot;&gt;确定性回归 → 世界 EEF 轨迹&lt;/text&gt;&lt;/g&gt;

    &lt;p class=&quot;text-small&quot;&gt;Gemma 特征节点和新增状态通路分别着色；节点文字同时标明含义。两边均冻结 Gemma 前 16 层、训练后续层。图中省略 XYZ、噪声和预测 key 引导 refine crop 的连接。&lt;/p&gt;
    &lt;details&gt;
      &lt;summary&gt;state 14 维、归一化与 AdaLN 公式&lt;/summary&gt;
      &lt;table aria-label=&quot;原始 state 与学习条件的区别&quot;&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;字段&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;维度&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;作用&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;当前 TCP 位置&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;定义当前局部坐标原点和世界轨迹起点。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;当前 TCP 四元数 xyzw&lt;/td&gt;&lt;td&gt;4&lt;/td&gt;&lt;td&gt;定义局部坐标朝向，恢复世界姿态。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;当前实测关节角&lt;/td&gt;&lt;td&gt;6&lt;/td&gt;&lt;td&gt;按训练集逐关节 center/scale 归一化后编码。&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;当前实测夹爪开度&lt;/td&gt;&lt;td&gt;1&lt;/td&gt;&lt;td&gt;0..1 映射到 −1..1；0.8 → 0.6 是输入编码，实际仍为 80% 开度。&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
      &lt;pre&gt;s_raw = [TCP7, q6, opening1]                         # [B,14]
s_local[:7] = [0,0,0,0,0,0,1]                        # 当前 TCP 自身是 identity
q_normalized = (q − center_train) / scale_train
opening_normalized = 2 × opening − 1
s = Linear14→256(s_local_normalized)
c = E_time(τ=1) + s + gate × E_key(key_relative)
Q_k = learned_k + E_tick(kΔt) + E_action(Y_init,k) + c
h_mod = (1 + scale(c)) ⊙ LayerNorm(h) + shift(c)
h_out = h + residual_gate(c) ⊙ Branch(h_mod)&lt;/pre&gt;
      &lt;p&gt;各层分别为 self-attention、cross-attention 和 FFN 生成调制参数。当前 TCP 虽在状态投影中固定为 identity，仍参与场景/key 的局部变换和动作的世界坐标恢复；当前没有关节速度、TCP 速度或历史状态。&lt;/p&gt;
      &lt;p&gt;归一化与直接通路减少状态被忽略的机会，回归直接监督部署输出，并沿用位移/二阶差分等物理损失。用户已确认 regression_state 整体解决本次轨迹问题；各项改动的独立贡献仍需消融。&lt;/p&gt;
    &lt;/details&gt;
  &lt;/section&gt;

  &lt;details open&gt;
    &lt;summary&gt;全部符号与维度&lt;/summary&gt;
    &lt;p&gt;以下数字对应当前常用三视角配置，不是任意 checkpoint 都能修改的超参数。B 保留为符号；P 点数按样本变化。Hₑ 是执行前缀，和图像高度没有关系。&lt;/p&gt;
    &lt;table aria-label=&quot;基本符号&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;符号&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;当前值&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;定义&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;B&lt;/td&gt;&lt;td&gt;可变&lt;/td&gt;&lt;td&gt;训练 batch；部署通常为 1。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;Cₛ&lt;/td&gt;&lt;td&gt;由数据配置确定&lt;/td&gt;&lt;td&gt;物理 RGB-D 相机数；不等于虚拟视角数。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;V / Hᵣ / Wᵣ&lt;/td&gt;&lt;td&gt;3 / 224 / 224&lt;/td&gt;&lt;td&gt;每级正交虚拟视角数及分辨率；coarse + refine 共 3×2 张。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;h / w / Nᵥ&lt;/td&gt;&lt;td&gt;16 / 16 / 768&lt;/td&gt;&lt;td&gt;每视角 patch 网格；每级 Nᵥ=Vhw 个图像 tokens。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;C&lt;/td&gt;&lt;td&gt;2048&lt;/td&gt;&lt;td&gt;当前 VLM 图像 hidden feature 通道。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;S / d&lt;/td&gt;&lt;td&gt;2 / 128&lt;/td&gt;&lt;td&gt;soft-coarse 配置的无序 slot 数及维度；S=2 不保证两者始终一一对应 T/R。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;r / dₐ&lt;/td&gt;&lt;td&gt;16 / 16&lt;/td&gt;&lt;td&gt;relation adapter 的低秩维及 anchor query 维度，不是类别数。&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;D / K / Hₑ&lt;/td&gt;&lt;td&gt;256 / 16 / 4&lt;/td&gt;&lt;td&gt;当前 state-chunk decoder hidden dim、预测长度及执行前缀。&lt;/td&gt;&lt;/tr&gt;

    &lt;p class=&quot;text-small&quot;&gt;[B,K,8] 是数学 batch 表示；当前单观测服务输出 actions 为 [K,8]。旧 flow（未启用 state_conditioning）另有一个 key memory token，因此 memory 长度为 1538，而非 1537。&lt;/p&gt;
  &lt;/details&gt;

  &lt;details&gt;
    &lt;summary&gt;训练、推理与执行：不要混淆的三个环节&lt;/summary&gt;
    &lt;h3&gt;O2：GT 是辅助监督，不是预测策略输入&lt;/h3&gt;
    &lt;p&gt;预测角色图对照 GT T/R 点投影 prior，结合匹配、objectness 与 NULL 辅助监督；同时学习 key-action。Gaussian teacher 不是严格实例边界。标准 RLBench key-action 训练使用 GT waypoint 及其扰动构造 refine crop，部署使用预测 coarse waypoint，存在需要验收的 teacher-forcing 差异。&lt;/p&gt;
    &lt;pre&gt;L_O2 = L_key-action + λ_mask L_mask + λ_presence L_presence + 可选辅助项&lt;/pre&gt;
    &lt;h3&gt;OHT chunk：训练条件使用预测 key/crop&lt;/h3&gt;
    &lt;p&gt;joint 模式另算 GT key-action loss；chunk 条件分支走 prediction-only 路径，GT key 不替换 decoder 输入。key 的离散解码和 crop 不可微；joint 可训练共享视觉特征，但不代表 chunk loss 穿过 key 的 argmax。&lt;/p&gt;
    &lt;pre&gt;L_joint = λ_key L_key + L_chunk [+ λ_flow L_flow]
L_chunk = λ_p L_position + λ_R L_rotation + λ_g BCE
        + λ_Δ L_displacement + λ_Δ² L_second-difference&lt;/pre&gt;
    &lt;p&gt;位置用物理尺度下 Smooth L1，旋转比较旋转矩阵；二阶差分匹配 GT 的位移变化，不是把所有转弯压平。所有未来标签损失按 m* 屏蔽，不跨缺帧/padding。Flow 的训练重建误差不能替代独立噪声采样的部署误差。&lt;/p&gt;
    &lt;h3&gt;滚动执行：一次预测 K，只执行前 Hₑ&lt;/h3&gt;
    &lt;pre&gt;观测 Oₜ → 预测 Â₁:K → 消费 Â₁:Hₑ → 重新观测 → 再预测
K = 16，Hₑ = 4；物理前缀时长 = Hₑ × Δt&lt;/pre&gt;
    &lt;p&gt;Δt 从 V4 时间戳与 frame_stride 解析并绑定契约，不能从 observation sample_stride 猜测。ChunkExecutor 在 tick 间插值位置和旋转，夹爪在对应 tick 边界切换；不等待到达远期 key 后才推进。跟踪误差、关节越限或环境终止可能提前中断，因此并非每次一定执行完 Hₑ 项。&lt;/p&gt;
    &lt;p&gt;当前 HTTP 等待暂停物理；包含网络/推理墙钟开销，不是异步实时系统。原有 waypoint 执行器与 timed chunk 是不同协议。OHT 输出不含有监督的 collision flag，也不等于具备碰撞规划。&lt;/p&gt;
  &lt;/details&gt;

  &lt;details&gt;
    &lt;summary&gt;当前实现边界与配置选择&lt;/summary&gt;
    &lt;ul&gt;
      &lt;li&gt;O2 soft-coarse：rlbench_o2_internal_slots_soft_coarse.yaml；两级独立无序 slots，soft_coarse_queries=True，旧动作/context 路由，objectness 阈值 0.25。&lt;/li&gt;
      &lt;li&gt;旧固定 T/R queries、硬继承与高分辨率 mask head 仍是独立实验；不是 soft-coarse 模式默认执行的模块。打开 shared_action_features 才让 anchor-enhanced feature 同时进入 R/G/C 的 global/local 路由。&lt;/li&gt;
      &lt;li&gt;OHT 当前已获用户轨迹改善确认的基线为 oht_chunk_v4_regression_state_8x40.yaml；不等于已有完整定量闭环结果。delta_state 与 flow_state 需要独立验收。&lt;/li&gt;
      &lt;li&gt;V4 chunk 目前只支持 baseline + EEF。不能在图上把 T/R → anchor → chunk 画成已实现直连；数据中有 object 标注也不会自动启用条件化。&lt;/li&gt;
      &lt;li&gt;regression_state 继承链文件名包含 flow，但最终 decoder_type=regression；较早 oht_chunk_v4_flow_8x40.yaml 不含后续 state/AdaLN/尺度等整套改动。&lt;/li&gt;
      &lt;li&gt;时序卷积处理一次预测内的 K 个未来动作，并不是历史帧 memory；当前没有持久 object bank、显式 phase 识别或已证明的坍塌恢复能力。&lt;/li&gt;
      &lt;li&gt;角色身份用于“操作谁”；局部接触、方向和间隙的增强属于待验证设计，不能把当前 anchor 响应解释成经过监督的接触点。&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/details&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;bridgevla-algorithm-overview&#x27;);
  const find = id =&gt; root.querySelector(&#x27;#&#x27; + id);
  const shape = (symbol, dimensions, meaning) =&gt; [symbol, dimensions, meaning];
  const step = (id, title, symbol, dims, description, equation, rows, source) =&gt;
    ({id, title, symbol, dims, description, equation, rows, source});
  const input = step(&#x27;input&#x27;,&#x27;观测与指令&#x27;,&#x27;Oₜ, ℓ&#x27;,&#x27;RGB-D + 标定&#x27;,
    &#x27;输入当前可见 RGB-D 与任务指令。物理相机 Cₛ 与虚拟视角 V=3 不同；将深度反投影并融合成带颜色点云。虚拟视角不能恢复物理相机从未看见的表面。&#x27;,
    &#x27;Pₜ = Fuse(BackProject(Oₜ, intrinsics, extrinsics))&#x27;,
    [shape(&#x27;Oₜ&#x27;,&#x27;Cₛ 组 RGB-D&#x27;,&#x27;每张图具有自己的相机参数&#x27;),shape(&#x27;Pₜ&#x27;,&#x27;B 个 [Nᵢ,3] + RGB&#x27;,&#x27;world 米制点；按样本可变长度&#x27;),shape(&#x27;ℓ&#x27;,&#x27;B 条字符串&#x27;,&#x27;VLM 内部转为可变长度 text tokens&#x27;)],
    &#x27;bridgevla/data/observations.py；mvt.MVT.render()&#x27;);
  const coarse = step(&#x27;coarse&#x27;,&#x27;全局三视角 + VLM&#x27;,&#x27;Fᶜ, Xᶜ&#x27;,&#x27;[B,768,2048]&#x27;,
    &#x27;全局点云归一化到工作 cube，再渲染三个正交 RGB 视角。共享 PaliGemma 在指令条件下输出每视角 16×16 个图像 tokens；XYZ 另保留作几何信息。&#x27;,
    &#x27;Rᶜ, Xᶜ = Render₃(Pₜ)\nFᶜ = VLM(Rᶜ, ℓ)&#x27;,
    [shape(&#x27;Rᶜ / Xᶜ&#x27;,&#x27;[B,3,3,224,224]&#x27;,&#x27;RGB 与 XYZ 分别各三通道&#x27;),shape(&#x27;Fᶜ&#x27;,&#x27;[B,768,2048]&#x27;,&#x27;等价 [3B,2048,16,16]&#x27;)],
    &#x27;mvt.MVT.render()；mvt_single.MVT.forward()&#x27;);
  const crop = step(&#x27;crop&#x27;,&#x27;解码与局部裁剪&#x27;,&#x27;Tᶜ → ŵᶜ → Rᶠ&#x27;,&#x27;[B,3] → 三视图&#x27;,
    &#x27;coarse translation logits 经跨视角 3D 解码得到 waypoint，再以它为中心缩放点云并重新渲染。Refine 重新运行共享 VLM；不是把 coarse 图直接 resize。O2 训练可能用 GT crop；OHT chunk 条件路径始终使用预测 crop。&#x27;,
    &#x27;Tᶜ = TranslationHead(Fᶜ_conditioned)\nŵᶜ = Decode3D(Tᶜ)\nxᶠ = s_crop (xᶜ − ŵᶜ)\nFᶠ = VLM(Render₃(xᶠ), ℓ)&#x27;,
    [shape(&#x27;Tᶜ&#x27;,&#x27;[B,3,224,224]&#x27;,&#x27;每视角位置 logits&#x27;),shape(&#x27;ŵᶜ&#x27;,&#x27;[B,3]&#x27;,&#x27;当前 cube 坐标，非 world TCP 状态&#x27;),shape(&#x27;Fᶠ&#x27;,&#x27;[B,768,2048]&#x27;,&#x27;与 coarse 共用 VLM 权重&#x27;)],
    &#x27;mvt.MVT.forward()；get_wpt()；trans_pc()&#x27;);
  const slots = (suffix, local) =&gt; step(&#x27;slots-&#x27; + suffix,
    local ? &#x27;独立局部 slots&#x27; : &#x27;无序 slots → T/R&#x27;, &#x27;U&#x27; + suffix + &#x27;, M&#x27; + suffix + &#x27;, Z&#x27; + suffix,
    &#x27;[B,2,128] / [B,3,2,16,16]&#x27;,
    local ? &#x27;局部 selector 仍从自己的图像特征预测 mask、objectness、T/R 和 NULL。Coarse soft tokens 只通过零初始化提示修改初始 queries；不传 coarse valid、几何或热图，所以不会因 coarse 判无效而强制关闭局部预测。&#x27; :
      &#x27;S 个无序 queries 读取当前三视角特征，输出每 slot 的 mask、objectness、角色分数，再软混合成 T/R 响应和 tokens。Reference posterior 包含 NULL。响应图不等于具有精确边界的实例分割。&#x27;,

  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)

  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)

  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
