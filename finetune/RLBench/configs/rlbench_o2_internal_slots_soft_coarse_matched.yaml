# Matched B arm: legacy internal_slots + frozen vision + soft coarse hints.
# For matched A, use rlbench_o2_internal_slots.yaml with --freeze_vision_tower.
# Once vision freezing is matched, only exp_id and soft_coarse_queries differ.
# Matched to that baseline setting, not an unavailable historical run config.
# Initialize BOTH arms from the same checkpoint with a fresh optimizer.
# Keep replay, MVT config, CLI freeze flags, seed and extra training budget equal.
exp_id: rlbench_o2_internal_slots_soft_coarse_matched
tasks: all
bs: 48
num_workers: 4
epochs: 50
train_iter: 38400
global_batch_size: 192

gradient_checkpointing: False
efficient_paligemma_forward: True
gpu_paligemma_preprocessing: False
flash_attention_2: False
freeze_vision_tower: True
freeze_gemma_prefix_layers: 18
freeze_multimodal_projector: True

sample_distribution_mode: task_uniform

train_visualization:
  enabled: True
  interval: 500
  save_png: True
  tensorboard: True
  output_dir: train_visualizations

# Oracle data remains auxiliary supervision, not a policy input.
use_oracle_objects: True
oracle_semantic_audit: False
oracle_semantic_contract:
  enforce: False
  required_phase_source: demo_events
  role_config: configs/rlbench_o2_semantic_roles.yaml
oracle_max_objects: 32
oracle_num_points: 512
use_predicted_objects: False

oracle_prior_adapter_rank: 16
oracle_relation_gated_adapter: True
oracle_adapter_translation_only: False
oracle_relation_anchor_rank: 16

# Only conditioning delta after matching A's vision freeze; keep other defaults.
object_conditioning:
  soft_coarse_queries: True

object_slots:
  enabled: True
  num_slots: 2
  slot_dim: 128
  decoder_layers: 2
  num_heads: 4
  point_samples: 128

peract:
  lr: 4e-5
  add_rgc_loss: True
  transform_augmentation_xyz: [0.125, 0.125, 0.125]
  transform_augmentation_rpy: [0.0, 0.0, 45.0]

rvt:
  place_with_mean: False
  img_aug: 0.0
  object_prior_mode: o2_internal_slots
  oracle_prior_mode: none
  object_prediction_confidence_threshold: 0.25
  object_slot_mask_loss_weight: 1.0
  object_slot_null_loss_weight: 0.25
  object_slot_diversity_loss_weight: 0.0
  oracle_prior_sigma: 2.0
  oracle_prior_active_role: auto
  oracle_prior_strict: False
  oracle_prior_relation: True
  oracle_log_base_loss: True
  oracle_valid_only_loss: False
