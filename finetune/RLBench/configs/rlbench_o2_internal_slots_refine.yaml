# Fixed Target/Reference queries + local mask decoder; no unordered-slot mixing.
# Initialize weights; do not resume an old optimizer after an architecture change.
exp_id: rlbench_o2_internal_slots_refine
seed: 0
tasks: all
bs: 24
num_workers: 2
# Avoid CUDA host-pinning failures in resource-limited multi-GPU containers.
pin_memory: False
train_visualization:
  enabled: True
  interval: 100
  tensorboard: True
  save_png: True
epochs: 50
train_iter: 38400
global_batch_size: 192
gradient_checkpointing: False
efficient_paligemma_forward: True
gpu_paligemma_preprocessing: False
flash_attention_2: False
freeze_vision_tower: True
freeze_gemma_prefix_layers: 18
freeze_multimodal_projector: True
sample_distribution_mode: task_uniform
use_oracle_objects: True
oracle_semantic_audit: False
oracle_semantic_contract:
  enforce: False
  required_phase_source: demo_events
  role_config: configs/rlbench_o2_semantic_roles.yaml
oracle_max_objects: 32
oracle_num_points: 512
use_predicted_objects: False
oracle_prior_adapter_rank: 16
oracle_relation_gated_adapter: True
oracle_adapter_translation_only: False
oracle_relation_anchor_rank: 16
object_conditioning:
  shared_action_features: True
  use_context: True
  # Direct role queries already supervise the policy T/R maps.
  supervise_mixed_role_maps: False
  inherit_coarse_roles: True
  preserve_role_tokens: True
  refine_role_masks: True
  # Update coarse-bound queries from observed refine features and spatial cues.
  refine_local_query: True
  # Detach only the refined maps at the action entrance for a gradient ablation.
  refine_mask_detach: False
object_slots:
  enabled: True
  predictor_type: role_queries
  num_slots: 2
  slot_dim: 128
  decoder_layers: 2
  num_heads: 4
  point_samples: 128
peract:
  lr: 4e-5
  gemma_lr: 1e-5
  gemma_layer_lr_decay: 1.0
  add_rgc_loss: True
  transform_augmentation_xyz: [0.125, 0.125, 0.125]
  transform_augmentation_rpy: [0.0, 0.0, 45.0]
rvt:
  place_with_mean: False
  img_aug: 0.0
  object_prior_mode: o2_internal_slots
  oracle_prior_mode: none
  object_prediction_confidence_threshold: 0.25
  object_slot_mask_loss_weight: 1.0
  object_slot_mixed_role_loss_weight: 0.0
  object_refine_mask_loss_weight: 1.0
  object_slot_null_loss_weight: 0.25
  # Visibility-checked T/R separation; original unordered-slot cosine loss is not used here.
  object_slot_diversity_loss_weight: 0.01
  object_refine_diversity_loss_weight: 0.01
  oracle_prior_sigma: 2.0
  oracle_prior_active_role: auto
  oracle_prior_strict: False
  oracle_prior_relation: True
  oracle_log_base_loss: False
  oracle_valid_only_loss: False
