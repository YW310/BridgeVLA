# Legacy disabled compatibility profile. Online control uses
# rlbench_slot_guided_sam3_online.yaml + slot_guided_sam3_online.py;
# reproducible snapshots use the separate *_offline.yaml / *_offline.py.
# Same architecture/recipe as rlbench_o2_role_queries.yaml.
# External SAM3 conditioning is OFF. This is not an activation/training launcher.
# Use the matching saved checkpoint configuration; do not change predictor type.
exp_id: rlbench_slot_guided_sam3_draft
tasks: all
bs: 24
num_workers: 4
epochs: 50
train_iter: 38400
global_batch_size: 192
gradient_checkpointing: False
efficient_paligemma_forward: True
gpu_paligemma_preprocessing: False
flash_attention_2: False
freeze_vision_tower: True
freeze_gemma_prefix_layers: 18
freeze_multimodal_projector: False
sample_distribution_mode: task_uniform
use_scheduler: False
use_oracle_objects: True
# Non-strict startup by default; enable both audit/enforce for strict provenance.
oracle_semantic_audit: False
oracle_semantic_contract:
  enforce: False
  required_phase_source: demo_events
  role_config: configs/rlbench_o2_semantic_roles.yaml
oracle_max_objects: 32
oracle_num_points: 512
use_predicted_objects: False
oracle_prior_adapter_rank: 16
oracle_relation_gated_adapter: True
oracle_adapter_translation_only: False
oracle_relation_anchor_rank: 16
object_conditioning:
  shared_action_features: True
  use_context: True
  supervise_mixed_role_maps: False
  inherit_coarse_roles: True
  preserve_role_tokens: True
object_slots:
  enabled: True
  predictor_type: role_queries
  num_slots: 2
  slot_dim: 128
  decoder_layers: 2
  num_heads: 4
  point_samples: 128
peract:
  lr: 4e-5
  optimizer_type: adamw
  gemma_lr: 1e-5
  gemma_layer_lr_decay: 1.0
  add_rgc_loss: True
  transform_augmentation_xyz: [0.125, 0.125, 0.125]
  transform_augmentation_rpy: [0.0, 0.0, 45.0]
rvt:
  # A verified REAL report and trusted current-frame importer remain required.
  enable_slot_guided_sam3: False
  place_with_mean: False
  img_aug: 0.0
  object_prior_mode: o2_internal_slots
  oracle_prior_mode: none
  object_prediction_confidence_threshold: 0.25
  object_slot_mask_loss_weight: 1.0
  object_slot_mixed_role_loss_weight: 1.0
  object_slot_null_loss_weight: 0.25
  object_slot_diversity_loss_weight: 0.01
  oracle_prior_sigma: 2.0
  oracle_prior_active_role: auto
  # Teacher geometry can be unavailable independently for either role.
  oracle_prior_strict: False
  oracle_prior_relation: True
  oracle_log_base_loss: False
  oracle_valid_only_loss: False
