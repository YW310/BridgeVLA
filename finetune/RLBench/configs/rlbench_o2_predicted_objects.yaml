# Object-prediction experiment. An external predictor supplies the selected
# Target/Reference point sets; no oracle_* point tensor enters the policy.
exp_id: rlbench_o2_predicted_objects
tasks: all
bs: 48
num_workers: 4
epochs: 50
train_iter: 38400
global_batch_size: 192

gradient_checkpointing: False
efficient_paligemma_forward: True
gpu_paligemma_preprocessing: False
flash_attention_2: False
freeze_gemma_prefix_layers: 18
freeze_multimodal_projector: True

sample_distribution_mode: task_uniform

train_visualization:
  enabled: True
  interval: 500
  save_png: True
  tensorboard: True
  output_dir: train_visualizations

use_oracle_objects: False
oracle_semantic_audit: False
use_predicted_objects: True
predicted_object_num_points: 512

# Reuse the relation adapter, but feed only predicted role point sets.
oracle_prior_adapter_rank: 16
oracle_relation_gated_adapter: True
oracle_adapter_translation_only: False
oracle_relation_anchor_rank: 16

peract:
  lr: 4e-5
  add_rgc_loss: True
  transform_augmentation_xyz: [0.125, 0.125, 0.125]
  transform_augmentation_rpy: [0.0, 0.0, 45.0]

rvt:
  place_with_mean: False
  img_aug: 0.0
  object_prior_mode: o2_predicted_relation
  # Legacy source selector must stay disabled in this experiment.
  oracle_prior_mode: none
  object_prediction_confidence_threshold: 0.25
  oracle_prior_sigma: 2.0
  oracle_prior_active_role: auto
  # Fail rather than silently evaluating without predictor outputs.
  oracle_prior_strict: True
  oracle_prior_relation: True
  oracle_log_base_loss: True
  oracle_valid_only_loss: False
