extends: oht_full_8x40.yaml
exp_id: oht-key-chunk-v4
# Reuse OHT full's layer-count freezing; train later Gemma layers and both heads.
freeze_vision_tower: true
freeze_multimodal_projector: true
freeze_language_model: false
freeze_gemma_prefix_layers: 16
agent:
  transform_augmentation: false
chunk_policy:
  enabled: true
  # Joint key supervision allows starting without a task-trained EEF checkpoint.
  stage: joint
  key_loss_weight: 1.0
  horizon: 16
  execute_horizon: 4
  hidden_dim: 256
  layers: 2
  heads: 4
  dropout: 0.0
  position_scale: 0.25
  position_weight: 5.0
  rotation_weight: 1.0
  gripper_weight: 1.0
